{% extends "base.html" %}
{% block content %}
<h1>ORDER ENTRY</h1>

<!-- One request queue for every order form on the page: while a preview,
     confirm or decline is in flight, further submissions are dropped, so a
     late response can never replace an ORDER CREATED confirmation. -->
<div id="order-entry" hx-sync="this:drop">
<form id="entry-form" action="/orders/preview" method="post"
      hx-post="/orders/preview" hx-target="#result" hx-swap="innerHTML"
      hx-disabled-elt="#order-entry button">
  <p><label for="cust_no">Customer no</label>
     <input id="cust_no" name="cust_no" maxlength="8" autocomplete="off" autofocus
            value="{{ form.cust_no or '' }}"></p>
  <p><label for="sku">SKU</label>
     <input id="sku" name="sku" maxlength="8" autocomplete="off" value="{{ form.sku or '' }}"></p>
  <p><label for="qty">Quantity</label>
     <input id="qty" name="qty" maxlength="4" inputmode="numeric" autocomplete="off"
            value="{{ form.qty or '' }}"></p>
  <button type="submit">Preview order</button>
</form>

<div id="result" aria-live="polite">
  {% if result_template %}{% include result_template %}{% endif %}
</div>
</div>
{% endblock %}
