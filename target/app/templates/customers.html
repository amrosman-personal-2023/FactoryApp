{% extends "base.html" %}
{% block content %}
<h1>CUSTOMER LOOKUP</h1>

<form hx-get="/customers/lookup" hx-target="#result" hx-swap="innerHTML">
  <label>Customer no: <input name="cust_no" maxlength="8" autofocus></label>
  <button type="submit">Search</button>
</form>

<div id="result"></div>

<h2>All customers</h2>
<table>
  <tr><th>No</th><th>Name</th><th>City</th><th>Tier</th><th>Credit</th></tr>
  {% for cust_no, name, city, tier, credit_lim in customers %}
  <tr><td>{{ cust_no }}</td><td>{{ name }}</td><td>{{ city }}</td>
      <td>{{ tier_names[tier] }}</td><td>${{ credit_lim }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
